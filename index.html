<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Patryc - Cosmética Capilar Botánica</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header-principal">
        <h1 class="logo">Beauty Patryc</h1>
        <button class="btn-carrito" onclick="abrirCarrito()">
            🛒 Carrito (<span id="contador-burbuja">0</span>)
        </button>
    </header>

    <main class="contenedor">
        <div id="grid-productos" class="grid-productos">
            <!-- Los productos se renderizan dinámicamente -->
        </div>
    </main>

    <aside id="sidebar-carrito" class="sidebar">
        <div class="sidebar-header">
            <h2>Tu Carrito</h2>
            <button class="btn-cerrar" onclick="cerrarCarrito()">✖</button>
        </div>
        
        <div id="items-carrito" class="items-carrito">
            <!-- Items del carrito -->
        </div>

        <div class="sidebar-footer">
            <div class="total">
                <h3>Total:</h3>
                <h3 id="total-carrito">$0</h3>
            </div>
            
            <div class="formulario-envio">
                <input type="text" id="cliente-nombre" placeholder="Tu Nombre Completo" required>
                <input type="text" id="cliente-direccion" placeholder="Dirección de Entrega" required>
            </div>
            
            <button id="btn-pagar" class="btn-pagar" onclick="enviarWhatsApp()" disabled>
                Pedir por WhatsApp
            </button>
        </div>
    </aside>

    <!-- Modal de Detalles del Producto -->
    <div id="modal-producto" class="modal-oculto">
        <div class="modal-contenido">
            <button class="btn-cerrar-modal" onclick="cerrarModal()">✖</button>
            <div class="modal-cuerpo" id="modal-cuerpo">
                <!-- La información se inyecta aquí desde JavaScript -->
            </div>
        </div>
    </div>


    <script type="module" src="js/app.js"></script>
</body>
</html>
